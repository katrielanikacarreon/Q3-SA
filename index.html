<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katzelle Memory Game</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700;800&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="menu">
  <img src="https://i.ibb.co/q6PsMpL/Untitled-design-6-removebg-preview.png" class="menu-cat" alt="Floating Cat">
  <button class="btn about-btn" onclick="window.location.href='about.html'">About the Authors</button>
  <div class="menu-box">
    <h1>Katzelle Memory</h1>
    <p>Match all the adorable cats before time runs out!</p>
    <button class="btn" onclick="startGame('easy')">Easy</button>
    <button class="btn" onclick="startGame('medium')">Medium</button>
    <button class="btn" onclick="startGame('hard')">Hard</button>
  </div>
</div>

<div id="game">
  <div class="scoreboard">
    <div class="score-bubble">Time: <span id="time">0</span></div>
    <div class="score-bubble">Matches: <span id="score">0</span></div>
    <div class="score-bubble"><button class="btn" onclick="goMenu()">Menu</button></div>
  </div>
  <div class="game-box">
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="popup" id="popup">
  <div class="popup-content">
    <h2 id="popupMessage">&nbsp;</h2>
    <button class="btn" onclick="closePopup()">Play Again</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
